[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pemflow"
version = "1.0.0"
description = "PEM-Flow video trajectory processing and dataset evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause AND AGPL-3.0-or-later"
license-files = ["LICENSE", "licenses/AGPL-3.0.txt", "THIRD_PARTY_NOTICES.md"]
dependencies = ["numpy", "pandas", "scipy", "shapely", "opencv-python", "tqdm"]

[project.optional-dependencies]
inference = ["torch", "torchvision", "ultralytics"]

[project.scripts]
pemflow = "pemflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
